<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>安装 · OB Vault</title><link rel="stylesheet" href="/install/entry.css"><link rel="stylesheet" href="/install/install.css"><script type="module" src="/install/install.js"></script></head>
<body><main class="setup-shell">
  <aside class="setup-intro"><a class="setup-brand" href="/">OB / VAULT</a><h1 id="intro-title">安装</h1><ol class="setup-steps" aria-label="安装步骤"><li data-step="1" class="active"><span>01</span><strong>密码</strong></li><li data-step="2"><span>02</span><strong>知识库</strong></li></ol><button id="end-test-button" hidden>结束测试</button></aside>
  <section class="setup-content" aria-live="polite"><p id="setup-loading">加载中…</p>
    <form id="setup-form" hidden>
      <section id="account-step" hidden><h2 id="account-title">设置密码</h2><label for="setup-password">密码</label><input id="setup-password" type="password" autocomplete="new-password" maxlength="1024"><label for="setup-confirmation">确认密码</label><input id="setup-confirmation" type="password" autocomplete="new-password" maxlength="1024"><p class="field-hint">12 至 1024 字节</p><div class="setup-actions"><button type="button" id="account-next">下一步</button></div></section>
      <section id="repository-step" hidden><h2>连接知识库</h2>
        <fieldset class="repository-options"><legend>来源</legend><label><input type="radio" name="mode" value="clone" checked><span><strong>GitHub 仓库</strong></span></label><label><input type="radio" name="mode" value="existing"><span><strong>服务器目录</strong></span></label><label><input type="radio" name="mode" value="empty"><span><strong>新建空知识库</strong></span></label></fieldset>
        <div id="clone-fields"><label for="repository-url">GitHub HTTPS 地址</label><input id="repository-url" type="url" placeholder="https://github.com/用户名/仓库.git" autocomplete="off"><label for="repository-branch">分支（可选）</label><input id="repository-branch" placeholder="默认分支" autocomplete="off"><p class="field-hint">仓库需已有提交。</p></div>
        <div id="existing-fields" hidden><label for="vault-path">服务器目录</label><div class="path-picker"><input id="vault-path" autocomplete="off" placeholder="选择目录"><button type="button" id="browse-directory">浏览</button></div><p class="field-hint">Docker 部署使用容器内路径。</p></div>
        <div id="credential-fields"><details id="credential-details" open><summary>GitHub 凭据</summary><label for="git-username">用户名（可选）</label><input id="git-username" autocomplete="off"><label for="git-token">Token</label><input id="git-token" type="password" autocomplete="new-password" maxlength="4096" placeholder="公开仓库可留空"><p class="field-hint" id="token-hint">私有库需要读取权限，推送需要写入权限。</p></details></div>
        <div class="setup-actions"><button type="button" class="secondary" id="repository-back">上一步</button><button type="submit" id="finish-setup">完成安装</button></div>
      </section>
    </form><p class="setup-error" id="setup-error" role="alert"></p><a href="/admin/login" class="setup-login" id="setup-login" hidden>前往后台登录 ↗</a>
  </section>
</main>
<dialog id="directory-dialog" class="directory-dialog" aria-labelledby="directory-title"><div class="directory-heading"><h2 id="directory-title">选择目录</h2><button type="button" id="directory-close">关闭</button></div><form id="directory-form"><label for="directory-location">路径</label><div class="path-picker"><input id="directory-location" autocomplete="off"><button>打开</button></div></form><div class="directory-toolbar"><button type="button" id="directory-parent">上级目录</button><button type="button" id="directory-select">使用此目录</button></div><div id="directory-list" class="directory-list"></div><p id="directory-error" role="alert"></p></dialog></body></html>
